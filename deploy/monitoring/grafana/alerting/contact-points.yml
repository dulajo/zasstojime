# Kontaktní bod pro alerty (ADR-0030). Token a chat se berou z .env (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: provoz
    receivers:
      - uid: provoz-telegram
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          chatid: ${TELEGRAM_CHAT_ID}
          disable_notification: false
      # Záložní e-mail: odkomentujte a nastavte GF_SMTP_* v docker-compose.yml (docs/provoz.md).
      # - uid: provoz-email
      #   type: email
      #   settings:
      #     addresses: ${ALERT_EMAIL}

policies:
  - orgId: 1
    receiver: provoz
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
