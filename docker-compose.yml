# Homelab: server + PostgreSQL (docs/technicke.md – Nasazení, postup v docs/provoz.md).
# Před `docker compose up --build` spusť v server/ `./gradlew build`.
# Monitoring (Prometheus + Grafana, ADR-0030): `docker compose --profile monitoring up -d`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zasstojime
      POSTGRES_USER: zasstojime
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Nastav DATABASE_PASSWORD v .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zasstojime -d zasstojime"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: src/main/docker/Dockerfile.jvm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/zasstojime
      DATABASE_USER: zasstojime
    ports:
      # API a /q/metrics jen lokálně; ven přes Cloudflare Tunnel (ADR-0026)
      - "127.0.0.1:8080:8080"

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Prague
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./deploy/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports:
      # Jen pro správu přes WireGuard/NPM (ADR-0026); GRAFANA_BIND = adresa VM ve správcovské síti
      - "${GRAFANA_BIND:-127.0.0.1}:3001:3000"

volumes:
  pgdata:
  prometheus:
  grafana:
