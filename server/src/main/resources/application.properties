# --- Aplikace (docs/technicke.md – Konfigurace) ---
app.poll-interval=${POLL_INTERVAL_S:30}s
app.poll-delay=5s
app.trip-timeout-s=${TRIP_TIMEOUT_S:900}
app.daily-flush-s=${DAILY_FLUSH_S:300}
app.max-delay-jump-s=${MAX_DELAY_JUMP_S:120}
app.alert-delay-s=${ALERT_DELAY_S:7200}
app.golemio.url=https://api.golemio.cz/v2/vehiclepositions?limit=10000&includeNotTracking=true
app.golemio.api-key=${GOLEMIO_API_KEY:}
app.gtfs.url=https://data.pid.cz/PID_GTFS.zip

# --- DB ---
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER:zasstojime}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.flyway.migrate-at-start=true

# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET

# --- OpenAPI (FR-34) ---
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Zasstojime API
quarkus.smallrye-openapi.info-description=Dochvilnost PID. Zdroj dat: Golemio, CC BY 4.0.

# --- Metriky (NFR-09) ---
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Log ---
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n
quarkus.log.category."org.jooq".level=WARN
# jOOQ OSS hlásí neověřenou verzi PostgreSQL, i když dialekt funguje
quarkus.log.category."org.jooq.impl.DefaultExecuteContext.logVersionSupport".level=ERROR

# --- Testy: bez plánovaných úloh a bez volání ven ---
%test.app.jobs-enabled=false
%test.quarkus.scheduler.enabled=true
